<script>
"use strict";
/* ================= 配置 ================= */
const ROWS = 8, COLS = 8, TYPES = 5;
const TYPE_FILES = ["1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg"];
const BG_FILE = "background.jpg";
const PAD = 7;                 // 格间距(逻辑像素)
const SWAP_MS = 170;           // 交换动画时长
const CLEAR_MS = 240;          // 消除动画时长
const FALL_MIN_MS = 130;       // 下落动画最短时长
const FALL_PER_PX = 7;         // 每逻辑像素增加的时间

/* ================= 画布与缩放 ================= */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
let boardPx = 0, tileSize = 0, dpr = 1;

function layout() {
  dpr = window.devicePixelRatio || 1;
  const wide = window.innerWidth >= 1020;   // 宽屏:左右侧栏并排
  const reserve = wide ? 440 : 0;           // 为两侧栏预留的宽度
  const extraH = wide ? 0 : 210;            // 窄屏:侧栏折到上下的额外高度
  boardPx = Math.min(window.innerWidth - 28 - reserve, window.innerHeight - 250 - extraH, 660);
  boardPx = Math.max(boardPx, 260);
  tileSize = Math.floor((boardPx - PAD * (COLS + 1)) / COLS);
  canvas.style.width = boardPx + "px";
  canvas.style.height = boardPx + "px";
  canvas.width = Math.round(boardPx * dpr);
  canvas.height = Math.round(boardPx * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const t of tiles) { t.tx = cellX(t.col); t.ty = cellY(t.row); }
}
function cellX(c) { return PAD + c * (tileSize + PAD) + tileSize / 2; }
function cellY(r) { return PAD + r * (tileSize + PAD) + tileSize / 2; }
window.addEventListener("resize", layout);

/* ================= 圆形图标预处理 ================= */
const icons = new Array(TYPES);   // 每个类型一张圆形离屏画布
let iconTex = TYPES * 128;
function buildIcons() {
  for (let i = 0; i < TYPES; i++) {
    const img = images[i];
    if (!img) continue;
    const s = 256;
    const off = document.createElement("canvas");
    off.width = off.height = s;
    const g = off.getContext("2d");
    // 封面式裁剪:图缩放到铺满正方形,取中心区域
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sc = Math.max(s / iw, s / ih);
    const dw = iw * sc, dh = ih * sc;
    // 人像偏上,裁剪中心略向上偏移,突出人脸
    const dx = (s - dw) / 2;
    const dy = (s - dh) / 2 - dh * 0.06;
    g.beginPath();
    g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
    g.clip();
    g.drawImage(img, dx, dy, dw, dh);
    g.restore();
    icons[i] = off;
  }
}
function drawIcon(type, x, y, size, radius) {
  const img = icons[type];
  const s = size * (radius || 0.72) * 2; // 有效直径
  if (img) {
    ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
  } else {
    ctx.fillStyle = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6"][type];
    ctx.beginPath(); ctx.arc(x, y, s / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + s * 0.5 + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(type + 1), x, y + 1);
  }
}

/* ================= 游戏状态 ================= */
const tiles = [];                 // 所有现存 tile
let grid = null;                  // grid[r][c] -> tile | null
let score = 0, steps = 0, best = +(localStorage.getItem("xxxl_best") || 0);
let busy = false;                 // 动画中锁定输入
let selected = null;              // {r,c}
let popups = [];                  // 得分飘字
let hintPair = null;              // 提示的两个 tile
let clearing = [];                // 正在消除的 tile
const $ = (id) => document.getElementById(id);

function newTile(type, row, col, spawnAbove) {
  const t = {
    type, row, col,
    x: cellX(col), y: spawnAbove ? cellY(-1 - Math.random() * 3) : cellY(row),
    tx: cellX(col), ty: cellY(row),
    scale: 1, alpha: 1,
    tween: null, clearT: null,
  };
  tiles.push(t);
  return t;
}

function assignTile(tile, row, col) {
  tile.row = row; tile.col = col;
  tile.tx = cellX(col); tile.ty = cellY(row);
}
function swapTiles(a, b) {
  const ar = a.row, ac = a.col;
  assignTile(a, b.row, b.col);
  assignTile(b, ar, ac);
  grid[a.row][a.col] = a;
  grid[b.row][b.col] = b;
}
function tileAt(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return grid[r][c];
}

/* 初始棋盘:无现成三连 */
function buildBoard() {
  grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  tiles.length = 0;
  do {
    tiles.length = 0;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        grid[r][c] = newTile(0 | (Math.random() * TYPES), r, c);
  } while (findMatches().size > 0 || !hasValidMove());
  hintPair = null;
}

/* ================= 消除检测 ================= */
function findMatches() {
  const marked = new Set();
  // 行
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const prev = tileAt(r, c - 1), cur = c < COLS ? tileAt(r, c) : null;
      if (prev && cur && cur.type === prev.type) { run++; continue; }
      if (prev && run >= 3) for (let k = c - run; k < c; k++) marked.add(r + "," + k);
      run = 1;
    }
  }
  // 列
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const prev = tileAt(r - 1, c), cur = r < ROWS ? tileAt(r, c) : null;
      if (prev && cur && cur.type === prev.type) { run++; continue; }
      if (prev && run >= 3) for (let k = r - run; k < r; k++) marked.add(k + "," + c);
      run = 1;
    }
  }
  return marked;
}

/* 是否存在可行交换(暴力试所有相邻对) */
function hasValidMove() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const a = grid[r][c];
      if (!a) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const b = tileAt(r + dr, c + dc);
        if (!b) continue;
        swapTiles(a, b);
        const ok = findMatches().size > 0;
        swapTiles(a, b);
        if (ok) return true;
      }
    }
  return false;
}
function findHint() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const a = grid[r][c];
      if (!a) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const b = tileAt(r + dr, c + dc);
        if (!b) continue;
        swapTiles(a, b);
        const ok = findMatches().size > 0;
        swapTiles(a, b);
        if (ok) return [a, b];
      }
    }
  return null;
}

function shuffleBoard() {
  const ts = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      ts.push(grid[r][c]);
  let ok = false, guard = 0;
  do {
    for (const t of ts) t.type = 0 | (Math.random() * TYPES);
    // 检查无现成三连且有可行步
    if (findMatches().size === 0 && hasValidMove()) ok = true;
  } while (!ok && ++guard < 500);
  hintPair = null;
}

/* ================= 动画辅助 ================= */
function tween(tile, x1, y1, dur, ease = "easeInOutQuad") {
  tile.tween = { x0: tile.x, y0: tile.y, x1, y1, t0: performance.now(), dur, ease };
}
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function easeInQuad(t) { return t * t; }
function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

/* ================= 音效 ================= */
// Unox.mp3:消除 1 组 | Dosx.mp3:消除 2 组 | Tresx.m4a:消除 3 组及以上
const SOUND_FILES = ["", "Unox.mp3", "Dosx.mp3", "Tresx.m4a"];
const SOUNDS = SOUND_FILES.map((f) => (f ? new Audio(f) : null));
for (const s of SOUNDS) {
  if (s) { s.preload = "auto"; s.volume = 0.9; }
}
let soundOn = true;
try { soundOn = localStorage.getItem("xxxl_sound") !== "0"; } catch (e) { /* 忽略 */ }
const btnSound = document.getElementById("btnSound");
function syncSoundBtn() {
  if (!btnSound) return;
  btnSound.textContent = soundOn ? "🔊 音效：开" : "🔇 音效：关";
  btnSound.classList.toggle("off", !soundOn);
}
if (btnSound) {
  btnSound.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("xxxl_sound", soundOn ? "1" : "0"); } catch (e) { /* 忽略 */ }
    if (!soundOn) for (const s of SOUNDS) { if (s) { s.pause(); s.currentTime = 0; } }
    syncSoundBtn();
  });
}
syncSoundBtn();
function playMatchSound(groups) {
  if (!soundOn || groups < 1) return;
  const s = SOUNDS[Math.min(groups, 3)];
  if (!s) return;
  try { s.currentTime = 0; } catch (e) { /* 忽略 */ }
  const p = s.play();
  if (p) p.catch(() => { /* 自动播放策略拦截时静默 */ });
}

/* ================= 统计一步操作消除的"组"数 ================= */
// 行列上同色且长度 >= 3 的连续段各算 1 组;互相交叉(如 L/T 形)合并为 1 组
function countMatchGroups() {
  const groups = [];
  function addRun(cells) {
    let hit = null;
    for (const g of groups) {
      if (cells.some((c) => g.has(c))) { hit = g; break; }
    }
    if (!hit) { groups.push(new Set()); hit = groups[groups.length - 1]; }
    cells.forEach((c) => hit.add(c));
    for (let i = groups.length - 1; i >= 0; i--) {
      const g = groups[i];
      if (g === hit) continue;
      if ([...g].some((c) => hit.has(c))) {
        g.forEach((c) => hit.add(c));
        groups.splice(i, 1);
      }
    }
  }
  // 行方向
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const prev = tileAt(r, c - 1), cur = c < COLS ? tileAt(r, c) : null;
      if (prev && cur && cur.type === prev.type) { run++; continue; }
      if (prev && run >= 3) {
        const cells = [];
        for (let k = c - run; k < c; k++) cells.push(r + "," + k);
        addRun(cells);
      }
      run = 1;
    }
  }
  // 列方向
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const prev = tileAt(r - 1, c), cur = r < ROWS ? tileAt(r, c) : null;
      if (prev && cur && cur.type === prev.type) { run++; continue; }
      if (prev && run >= 3) {
        const cells = [];
        for (let k = r - run; k < r; k++) cells.push(k + "," + c);
        addRun(cells);
      }
      run = 1;
    }
  }
  return groups.length;
}

/* ================= 核心流程 ================= */
async function resolveBoard() {
  busy = true;
  let combo = 0;
  let moveGroups = 0;   // 本步操作总共消除的组数(含连锁)
  while (true) {
    const set = findMatches();
    if (set.size === 0) break;
    combo++;
    moveGroups += countMatchGroups();
    const pts = set.size * 10 * combo;
    score += pts;
    best = Math.max(best, score);
    localStorage.setItem("xxxl_best", String(best));
    $("score").textContent = score;
    $("best").textContent = best;
    if (combo >= 2) addPopup(boardPx / 2, boardPx / 2, "连击 x" + combo + "! +" + pts, combo);
    // 消除动画
    clearing.length = 0;
    const now = performance.now();
    for (const key of set) {
      const [r, c] = key.split(",").map(Number);
      const t = grid[r][c];
      if (!t) continue;
      t.clearT = now;
      clearing.push(t);
      if (set.size <= 8) addPopup(t.x, t.y, "+" + (10 * combo));
    }
    await sleep(CLEAR_MS + 30);
    for (const t of clearing) { if (t.clearT === now) t.dead = true; }
    clearing.length = 0;
    for (const t of tiles) if (t.dead) { grid[t.row][t.col] = null; }
    // 移除死亡
    for (let i = tiles.length - 1; i >= 0; i--) if (tiles[i].dead) tiles.splice(i, 1);
    // 下落与补充
    let maxDur = FALL_MIN_MS;
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const t = grid[r][c];
        if (!t) continue;
        if (write !== r) {
          grid[r][c] = null;
          assignTile(t, write, c);
          grid[write][c] = t;
          const d = Math.abs(cellY(r) - cellY(write));
          const dur = FALL_MIN_MS + d * FALL_PER_PX;
          tween(t, t.tx, t.ty, dur, "easeInQuad");
          maxDur = Math.max(maxDur, dur);
        }
        write--;
      }
      // 顶部补新的
      for (let r = write; r >= 0; r--) {
        const t = newTile(0 | (Math.random() * TYPES), r, c, true);
        grid[r][c] = t;
        const d = cellY(r) - t.y;
        const dur = FALL_MIN_MS + d * FALL_PER_PX;
        tween(t, t.tx, t.ty, dur, "easeInQuad");
        maxDur = Math.max(maxDur, dur);
      }
    }
    await sleep(maxDur + 40);
  }
  // 无可消且无可行步 → 洗牌
  if (!hasValidMove()) { shuffleBoard(); addPopup(boardPx / 2, boardPx / 2, "无可消除,自动洗牌 🔀"); }
  // 按本次操作消除的组数播放音效:1 组 Unox / 2 组 Dosx / 多组 Tresx
  if (moveGroups > 0) playMatchSound(moveGroups);
  busy = false;
}

/* 执行一次交换(带动画,非法则换回) */
async function trySwap(a, b) {
  selected = null; hintPair = null;
  swapTiles(a, b);
  if (findMatches().size === 0) {
    tween(a, a.tx, a.ty, SWAP_MS);
    tween(b, b.tx, b.ty, SWAP_MS);
    await sleep(SWAP_MS + 20);
    swapTiles(a, b);
    tween(a, a.tx, a.ty, SWAP_MS);
    tween(b, b.tx, b.ty, SWAP_MS);
    await sleep(SWAP_MS + 20);
    return;
  }
  steps++;
  $("steps").textContent = steps;
  tween(a, a.tx, a.ty, SWAP_MS, "easeOutBack");
  tween(b, b.tx, b.ty, SWAP_MS, "easeOutBack");
  await sleep(SWAP_MS + 20);
  await resolveBoard();
}

/* ================= 飘字 ================= */
function addPopup(x, y, text, big) {
  popups.push({ x, y, text, t0: performance.now(), big: !!big });
}

/* ================= 输入 ================= */
function posToCell(mx, my) {
  const c = Math.floor((mx - PAD) / (tileSize + PAD));
  const r = Math.floor((my - PAD) / (tileSize + PAD));
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  const cx = cellX(c), cy = cellY(r);
  if (Math.abs(mx - cx) > tileSize / 2 + PAD || Math.abs(my - cy) > tileSize / 2 + PAD) return null;
  return { r, c };
}
function boardPos(ev) {
  const rect = canvas.getBoundingClientRect();
  return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
}

let dragFrom = null, dragMoved = false;
canvas.addEventListener("pointerdown", (ev) => {
  if (busy) return;
  const p = boardPos(ev);
  const cell = posToCell(p.x, p.y);
  if (!cell || !grid[cell.r][cell.c]) return;
  dragFrom = cell; dragMoved = false;
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove", (ev) => {
  if (!dragFrom || busy) return;
  const p = boardPos(ev);
  const cx = cellX(dragFrom.c), cy = cellY(dragFrom.r);
  const dx = p.x - cx, dy = p.y - cy;
  if (!dragMoved && Math.max(Math.abs(dx), Math.abs(dy)) > tileSize * 0.45) {
    dragMoved = true;
    const a = grid[dragFrom.r][dragFrom.c];
    let dr = 0, dc = 0;
    if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1; else dr = dy > 0 ? 1 : -1;
    const b = tileAt(dragFrom.r + dr, dragFrom.c + dc);
    dragFrom = null;
    if (b) { if (!busy) trySwap(a, b); else selected = null; }
  }
});
canvas.addEventListener("pointerup", (ev) => {
  if (busy) { dragFrom = null; return; }
  if (!dragFrom) return;
  const p = boardPos(ev);
  if (dragMoved) { dragFrom = null; return; }
  const cell = posToCell(p.x, p.y);
  dragFrom = null;
  if (!cell) return;
  if (selected && (selected.r !== cell.r || selected.c !== cell.c)) {
    const a = grid[selected.r][selected.c], b = grid[cell.r][cell.c];
    const adj = Math.abs(selected.r - cell.r) + Math.abs(selected.c - cell.c) === 1;
    selected = null;
    if (adj && a && b) { trySwap(a, b); }
    else selected = cell;
  } else {
    selected = (selected && selected.r === cell.r && selected.c === cell.c) ? null : cell;
  }
});
canvas.addEventListener("pointercancel", () => { dragFrom = null; });

$("btnHint").addEventListener("click", () => {
  if (busy) return;
  hintPair = findHint();
});
$("btnRestart").addEventListener("click", () => {
  if (busy) return;
  score = 0; steps = 0;
  $("score").textContent = 0; $("steps").textContent = 0; $("best").textContent = best;
  selected = null; popups.length = 0;
  buildBoard();
});

/* ================= 渲染 ================= */
function drawTile(t, now, ms) {
  const scale = t.scale, alpha = t.alpha;
  // 下落/交换
  if (t.tween) {
    const k = Math.min(1, (now - t.tween.t0) / t.tween.dur);
    const e = t.tween.ease === "easeInQuad" ? easeInQuad(k) : t.tween.ease === "easeOutBack" ? easeOutBack(k) : easeInOutQuad(k);
    t.x = t.tween.x0 + (t.tween.x1 - t.tween.x0) * e;
    t.y = t.tween.y0 + (t.tween.y1 - t.tween.y0) * e;
    if (k >= 1) { t.x = t.tween.x1; t.y = t.tween.y1; t.tween = null; }
  }
  // 消除
  let s = scale, a = alpha;
  if (t.clearT != null) {
    const k = Math.min(1, (now - t.clearT) / CLEAR_MS);
    s = 1 + 0.35 * Math.sin(k * Math.PI) - 0.9 * k;
    a = 1 - k;
    if (k >= 1) { t.dead = true; t.clearT = null; }
  }
  const r = tileSize / 2;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  // 阴影
  ctx.beginPath();
  ctx.arc(t.x, t.y + tileSize * 0.08, r * Math.max(0.05, s) * 0.95, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fill();
  // 底圆
  ctx.beginPath();
  ctx.arc(t.x, t.y, r * Math.max(0.05, s), 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
  // 圆形头像
  const cs = r * 2 * Math.max(0.05, s);
  drawIcon(t.type, t.x, t.y, cs);
  // 边框
  ctx.beginPath();
  ctx.arc(t.x, t.y, r * Math.max(0.05, s) - 1, 0, Math.PI * 2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.stroke();
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const ms = now - last; last = now;
  ctx.clearRect(0, 0, boardPx, boardPx);
  // 网格底
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const x = PAD + c * (tileSize + PAD), y = PAD + r * (tileSize + PAD);
      roundRect(ctx, x, y, tileSize, tileSize, 10);
      ctx.fill();
    }
  // 提示高亮
  if (hintPair) {
    const p = (Math.sin(now / 220) + 1) / 2;
    for (const t of hintPair) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, tileSize / 2 + 2 + p * 4, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(255,220,90,${0.55 + 0.4 * p})`;
      ctx.stroke();
    }
  }
  // 选中
  if (selected) {
    const t = grid[selected.r][selected.c];
    if (t) {
      const p = (Math.sin(now / 260) + 1) / 2;
      ctx.beginPath();
      ctx.arc(t.x, t.y, tileSize / 2 + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(0,235,170,${0.6 + 0.4 * p})`;
      ctx.stroke();
    }
  }
  // 方块
  for (const t of tiles) if (!t.dead) drawTile(t, now, ms);
  // 飘字
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    const k = Math.min(1, (now - p.t0) / 900);
    if (k >= 1) { popups.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - k;
    ctx.font = "900 " + (p.big ? Math.min(34, tileSize * 0.8) : Math.max(13, tileSize * 0.32)) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4;
    ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.strokeText(p.text, p.x, p.y - 40 * k);
    ctx.fillStyle = p.big ? "#ffe36e" : "#ffffff";
    ctx.fillText(p.text, p.x, p.y - 40 * k);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(loop);
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ================= 图片加载 & 启动 ================= */
const images = new Array(TYPES);
function start() {
  layout();
  buildBoard();
  $("best").textContent = best;
  requestAnimationFrame(loop);
}
// 先加载全部图标素材,再开始游戏(图片为本地文件,加载极快)
Promise.all(TYPE_FILES.map((f) => new Promise((res) => {
  const img = new Image();
  img.onload = () => res(img);
  img.onerror = () => res(null);
  img.src = f;
}))).then((imgs) => {
  imgs.forEach((img, i) => { images[i] = img; });
  buildIcons();
  start();
});
</script>
